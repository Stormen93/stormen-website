<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection | Stormen</title>

  <!-- Roboto Condensed -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Compiled Tailwind (dist/site.css is generated by `npm run build`) -->
  <link rel="stylesheet" href="/dist/site.css?v=2" />

  <!-- Custom flip effect (kept separate so Tailwind never purges it) -->
  <style>
  body{font-family:'Roboto Condensed',sans-serif;}

  .merch-item        { position:relative; overflow:hidden;
                        /* NEW → unify size */
                        width:100%;        /* stretch to grid column */
                        height:22rem;      /* ≈ 352 px — pick what looks good */
                      }

  /* front + back share the same fit rules */
  .merch-item img    { position:absolute; inset:0;
                        width:100%; height:100%;
                        object-fit:contain;         /* keep full pic, no crop     */
                        object-position:center;     /* centre it in the frame     */
                        transition:opacity .3s ease;
                      }

  .merch-item .back  { opacity:0; pointer-events:none; }
  .merch-item:hover .front,
  .merch-item.flip  .front { opacity:0; }
  .merch-item:hover .back,
  .merch-item.flip  .back  { opacity:1; }
</style>

  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.1/dist/feather.min.js"></script>
</head>

  <div id="backdrop" class="fixed inset-0 bg-gray-900 opacity-0 pointer-events-none z-40 transition-opacity"></div>

  <!-- Flip-on-tap helper for mobile -->
  <script>
    document.querySelectorAll('.merch-item').forEach(card=>{
      card.addEventListener('touchstart',()=>card.classList.toggle('flip'),{passive:true});
    });
  </script>
