<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection | Stormen</title>
  <!-- Roboto Condensed -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {} } }
</script>
<!-- Site CSS -->
<link href="site.css" rel="stylesheet"/>
  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.1/dist/feather.min.js"></script>
  <style>body { font-family: 'Roboto Condensed', sans-serif; }</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 dark:bg-gray-900 text-gray-900 dark:text-gray-100 dark:text-gray-100 min-h-screen flex flex-col">
  <!-- Backdrop -->
  <div id="backdrop" class="fixed inset-0 bg-gray-900 opacity-0 pointer-events-none z-40 transition-opacity"></div>

  <!-- Header -->
  <header id="siteHeader" class="fixed top-0 inset-x-0 z-50 h-20 flex items-center bg-transparent transition-colors duration-300">
    <button id="openMenuBtn" class="absolute left-4 top-1/2 transform -translate-y-1/2 p-3 focus:outline-none">
      <span class="burger-line"></span>
      <span class="burger-line lower"></span>
    </button>
    <a href="/" class="mx-auto h-36 flex items-center justify-center">
      <img src="images/logo_yellow.png" alt="Stormen yellow logo" class="h-36" />
    </a>
  
  <!-- Dark/Light toggle button -->
  <button id="themeToggle"
          class="absolute right-4 top-1/2 transform -translate-y-1/2 p-3 transition-colors duration-300"
          aria-label="Toggle Theme">
    <img id="themeIcon"
         src="images/lightmode.png"
         alt="Toggle theme"
         class="w-8 h-8"/>
  </button></header>

  <!-- Side Panel -->
  <aside id="sidePanel" class="fixed inset-y-0 left-0 w-72 bg-white text-gray-900 -translate-x-full transform z-50 p-6 shadow-xl uppercase font-semibold" style="visibility: hidden;">
    <button id="closeMenuBtn" class="absolute right-3 top-3 p-3 focus:outline-none">
      <span class="burger-line"></span>
      <span class="burger-line lower"></span>
    </button>
    <nav class="mt-14 space-y-6 pl-4">
      <div>
        <a href="/">
          <i data-feather="home" class="inline-block w-5 h-5 mr-2"></i>
          <span>HOME</span>
        </a>
      </div>
      <div>
        <a href="/stormen">
          <i data-feather="zap" class="inline-block w-5 h-5 mr-2"></i>
          <span>STORMEN</span>
        </a>
      </div>
      <div>
        <a href="/watch">
          <i data-feather="play" class="inline-block w-5 h-5 mr-2"></i>
          <span>WATCH</span>
        </a>
      </div>
      <div>
        <a href="/collection">
          <i data-feather="shopping-cart" class="inline-block w-5 h-5 mr-2"></i>
          <span>COLLECTION</span>
        </a>
      </div>
      <div>
        <a href="/social">
          <i data-feather="share-2" class="inline-block w-5 h-5 mr-2"></i>
          <span>SOCIAL MEDIA</span>
        </a>
      </div>
      <div>
        <a href="mailto:stormen@thenewgen.com">
          <i data-feather="mail" class="inline-block w-5 h-5 mr-2"></i>
          <span>CONTACT</span>
        </a>
      </div>
    </nav>
  </aside>
 
  <!-- Collection Grid -->
  <main class="flex-grow w-[90%] mx-auto px-2 pt-24 pb-16 grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
     <a href="https://stormen-shop.fourthwall.com/products/stormen-t-shirt" target="_blank" class="block merch-item min-w-0 w-full">
      <img src="images/tshirt_front.png" alt="Stormen Tee front" class="rounded-lg shadow-md front" />
      <img src="images/tshirt_back.png" alt="Stormen Tee back" class="rounded-lg shadow-md back" />
    </a>
    <a href="https://stormen-shop.fourthwall.com/products/stormen-hoodie" target="_blank" class="block merch-item min-w-0 w-full">

      <img src="images/hoodies_back.png" alt="Stormen Hoodie back" class="rounded-lg shadow-md back" />
    </a>
    <a href="https://stormen-shop.fourthwall.com/en-usd/products/stormen-dad-hat" target="_blank" class="block merch-item min-w-0 w-full">
      <img src="images/dadhat_front.png" alt="Stormen Dad Hat front" class="rounded-lg shadow-md front" />
      <img src="images/dadhat_back.png" alt="Stormen Dad Hat back" class="rounded-lg shadow-md back" />

    <a href="https://stormen-shop.fourthwall.com/en-usd/products/stormen-joggers" target="_blank" class="block merch-item min-w-0 w-full">

      <img src="images/joggers_back.png" alt="Stormen Joggers back" class="rounded-lg shadow-md back" />
    </a>
    <a href="https://stormen-shop.fourthwall.com/en-usd/products/stormen-coffee-mug" target="_blank" class="block merch-item min-w-0 w-full">
      <img src="images/stormen_mugblackfront.png" alt="Stormen Black Mug front" class="rounded-lg shadow-md front" />
      <img src="images/stormen_mugblackback.png" alt="Stormen Black Mug back" class="rounded-lg shadow-md back" />
    </a>
    <a href="https://stormen-shop.fourthwall.com/en-usd/products/stormen-moustache-mug" target="_blank" class="block merch-item min-w-0 w-full">
      <img src="images/whitemug_back.png" alt="Stormen White Mug front" class="rounded-lg shadow-md front" />
      <img src="images/whitemug_front.png" alt="Stormen White Mug back" class="rounded-lg shadow-md back" />
    </a>
    <a href="https://stormen-shop.fourthwall.com/en-usd/products/octane-hype-holo-sticker" target="_blank" class="block merch-item min-w-0 w-full">
      <img src="images/hype_sticker.png" alt="Stormen Hype Sticker front" class="rounded-lg shadow-md front" />
      <img src="images/hype_sticker2.png" alt="Stormen Hype Sticker back" class="rounded-lg shadow-md back" />
    </a>
    <a href="https://stormen-shop.fourthwall.com/en-usd/products/octane-gasm-holo-sticker" target="_blank" class="block merch-item min-w-0 w-full">
      <img src="images/gasm_sticker.png" alt="Stormen Gasm Sticker front" class="rounded-lg shadow-md front" />
      <img src="images/gasm_sticker2.png" alt="Stormen Gasm Sticker back" class="rounded-lg shadow-md back" />

    <div class="container mx-auto flex flex-col items-center space-y-6">
      <div class="flex space-x-6">
        <a href="https://instagram.com/stormentwitch" target="_blank" class="social-link">

<!-- Cloudflare Email Decode -->
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>

</body>
