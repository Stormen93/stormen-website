  <style>
    body { font-family: 'Roboto Condensed', sans-serif; }

    .merch-item {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 22rem;
    }

    .merch-item img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transition: opacity .3s ease;
    }

    .merch-item .back { opacity: 0; pointer-events: none; }
    .merch-item:hover .front,
    .merch-item.flip .front { opacity: 0; }
    .merch-item:hover .back,
    .merch-item.flip .back { opacity: 1; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.1/dist/feather.min.js"></script>

  <script>
    if (window.matchMedia('(hover: none), (pointer: coarse)').matches) {
      const cards = document.querySelectorAll('.merch-item');

      cards.forEach((card) => {
        card.addEventListener('click', (event) => {
          if (card.classList.contains('flip')) return;

          event.preventDefault();
          cards.forEach((otherCard) => {
            if (otherCard !== card) otherCard.classList.remove('flip');
          });
          card.classList.add('flip');
        });
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('.merch-item')) {
          cards.forEach((card) => card.classList.remove('flip'));
        }
      });
    }
  </script>
