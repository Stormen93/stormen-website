<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stormen | Watch</title>
  <!-- Roboto Condensed -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet"/>
  <!-- Roboto Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {} } }
</script>
<!-- Site CSS -->
<link href="site.css" rel="stylesheet"/>
  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.1/dist/feather.min.js"></script>
  <style>body { font-family: 'Roboto Condensed', sans-serif; }</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 dark:bg-gray-900 text-gray-900 dark:text-gray-100 dark:text-gray-100 min-h-screen flex flex-col">
  <!-- Backdrop -->
  <div id="backdrop" class="fixed inset-0 bg-gray-900 opacity-0 pointer-events-none z-40 transition-opacity"></div>

  <!-- Header -->
  <header id="siteHeader" class="fixed top-0 inset-x-0 z-50 h-20 flex items-center bg-transparent transition-colors duration-300">
    <button id="openMenuBtn" class="absolute left-4 top-1/2 transform -translate-y-1/2 p-3 focus:outline-none">
      <span class="burger-line"></span>
      <span class="burger-line lower"></span>
    </button>
    <a href="/" class="mx-auto h-36 flex items-center justify-center">
      <img src="images/logo_yellow.png" alt="Stormen yellow logo" class="h-36" />
    </a>
  
  <!-- Dark/Light toggle button -->
  <button id="themeToggle"
          class="absolute right-4 top-1/2 transform -translate-y-1/2 p-3 transition-colors duration-300"
          aria-label="Toggle Theme">
    <img id="themeIcon"
         src="images/lightmode.png"
         alt="Toggle theme"
         class="w-8 h-8"/>
  </button></header>
 
  <!-- Side Panel -->
  <aside id="sidePanel" class="fixed inset-y-0 left-0 w-72 bg-white text-gray-900 -translate-x-full transform z-50 p-6 shadow-xl uppercase font-semibold" style="visibility: hidden;">
    <button id="closeMenuBtn" class="absolute right-3 top-3 p-3 focus:outline-none">
      <span class="burger-line"></span>
      <span class="burger-line lower"></span>
    </button>
    <nav class="mt-14 space-y-6 pl-4">
      <div>
        <a href="/">
          <i data-feather="home" class="inline-block w-5 h-5 mr-2"></i>
          <span>HOME</span>
        </a>
      </div>
      <div>
        <a href="/stormen">
          <i data-feather="zap" class="inline-block w-5 h-5 mr-2"></i>
          <span>STORMEN</span>
        </a>
      </div>
      <div>
        <a href="/watch">
          <i data-feather="play" class="inline-block w-5 h-5 mr-2"></i>
          <span>WATCH</span>
        </a>
      </div>
      <div>
        <a href="/collection">
          <i data-feather="shopping-cart" class="inline-block w-5 h-5 mr-2"></i>
          <span>COLLECTION</span>
        </a>
      </div>
      <div>
        <a href="/social">
          <i data-feather="share-2" class="inline-block w-5 h-5 mr-2"></i>
          <span>SOCIAL MEDIA</span>
        </a>
      </div>
      <div>
        <a href="mailto:stormen@thenewgen.com">
          <i data-feather="mail" class="inline-block w-5 h-5 mr-2"></i>
          <span>CONTACT</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Watch Content -->
  <main class="flex-grow min-h-screen container mx-auto px-4 pt-32 pb-20 flex flex-col items-center">
  <!-- 16:9 video wrapper with orange border -->
   <div class="container mx-auto px-4">
    <div class="embed-wrapper">
      <iframe
        src="https://www.youtube.com/embed/videoseries?list=PLlRbVc_QVCbVIITtyLoazGK0g4IRwDa_J"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="flex justify-center">
      <a href="https://twitch.tv/stormen" target="_blank" class="watch-link mt-8">
        <span>WATCH STORMEN’S STREAM</span>
      </a>
    </div>
  </div>
</main>

  <!-- Footer -->
  <footer class="bg-white py-10 text-gray-900">
    <div class="container mx-auto flex flex-col items-center space-y-6">
      <div class="flex space-x-6">
        <a href="https://instagram.com/stormentwitch" target="_blank" class="social-link">
          <img src="images/instagram.png" alt="Instagram" class="w-8 h-8" />
        </a>
        <a href="https://www.tiktok.com/@stormentwitch" target="_blank" class="social-link">
          <img src="images/tiktok.png" alt="TikTok" class="w-7 h-7" />
        </a>
        <a href="https://twitter.com/stormentv" target="_blank" class="social-link">
          <img src="images/twitter.png" alt="Twitter" class="w-8 h-8" />
        </a>
        <a href="https://youtube.com/@stormentv" target="_blank" class="social-link">
          <img src="images/youtube.png" alt="YouTube" class="w-8 h-8" />
        </a>
        <a href="https://twitch.tv/stormen" target="_blank" class="social-link">
          <img src="images/twitch.png" alt="Twitch" class="w-8 h-8" />
        </a>
        <a href="https://discord.gg/8pgUDRT5Wv" target="_blank" class="social-link">
          <img src="images/discord.png" alt="Discord" class="w-8 h-8"/>
        </a>
        <a href="mailto:stormen@thenewgen.com" target="_blank" class="social-link">
          <i data-feather="mail" class="w-8 h-8"></i>
        </a>
      </div>
      <div class="w-full border-t border-gray-700"></div>
      <div class="text-sm">© 2025 Stormen. All rights reserved.</div>
    </div>
  </footer>

 <!-- Cloudflare Email Decode -->
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>
  <!-- Site JS -->
  <script src="site.js" defer></script>
</body>
</html>
