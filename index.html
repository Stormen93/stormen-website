<!DOCTYPE html>

<html lang="en" class="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stormen | Official Site</title>
  <!-- Roboto Condensed -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Roboto Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }
  </script>
  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.1/dist/feather.min.js"></script>
  <!-- Site CSS -->
  <link href="site.css" rel="stylesheet" />
  <style>body { font-family: 'Roboto Condensed', sans-serif; }</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
  <!-- Backdrop -->
  <div id="backdrop" class="fixed inset-0 bg-gray-900 opacity-0 pointer-events-none z-40 transition-opacity"></div>

  <!-- Header -->

  <header id="siteHeader" class="fixed top-0 inset-x-0 z-50 h-20 flex items-center bg-transparent transition-colors duration-300">
    <button id="openMenuBtn" class="absolute left-4 top-1/2 transform -translate-y-1/2 p-3 focus:outline-none">
      <span class="burger-line"></span>
      <span class="burger-line lower"></span>
    </button>
    <a href="/" class="mx-auto relative h-36 flex items-center justify-center">
      <img src="images/logo_white.png" alt="Stormen white logo" class="h-36 logo-white transition-opacity duration-300" />
      <img src="images/logo_yellow.png" alt="Stormen yellow logo" class="h-36 logo-black opacity-0 absolute inset-0 transition-opacity duration-300" />
    </a>
    <!-- Dark/Light Toggle -->
    <button id="themeToggle" class="absolute right-4 top-1/2 transform -translate-y-1/2 p-3 transition-colors duration-300" aria-label="Toggle Theme">
      <img id="themeIcon" src="images/lightmode.png" alt="Toggle theme" class="w-8 h-8" />
    </button>
  </header>

  <!-- Side Panel -->

  <aside id="sidePanel" class="fixed inset-y-0 left-0 w-72 bg-white text-gray-900 -translate-x-full transform z-50 p-6 shadow-xl" style="visibility: hidden;" aria-hidden="true">
    <button id="closeMenuBtn" class="absolute right-3 top-3 p-3 focus:outline-none">
      <span class="burger-line"></span>
      <span class="burger-line lower"></span>
    </button>
     <nav class="mt-14 space-y-6 pl-4">
      <div>
        <a href="/">
          <i data-feather="home" class="inline-block w-5 h-5 mr-2"></i>
          <span>HOME</span>
        </a>
      </div>
      <div>
        <a href="/stormen">
          <i data-feather="zap" class="inline-block w-5 h-5 mr-2"></i>
          <span>STORMEN</span>
        </a>
      </div>
      <div>
        <a href="/watch">
          <i data-feather="play" class="inline-block w-5 h-5 mr-2"></i>
          <span>WATCH</span>
        </a>
      </div>
      <div>
        <a href="/collection">
          <i data-feather="shopping-cart" class="inline-block w-5 h-5 mr-2"></i>
          <span>COLLECTION</span>
        </a>
      </div>
      <div>
        <a href="/social">
          <i data-feather="share-2" class="inline-block w-5 h-5 mr-2"></i>
          <span>SOCIAL MEDIA</span>
        </a>
      </div>
      <div>
        <a href="mailto:stormen@thenewgen.com">
          <i data-feather="mail" class="inline-block w-5 h-5 mr-2"></i>
          <span>CONTACT</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Hero Section -->

  <section class="relative h-screen overflow-hidden">
    <video class="absolute inset-0 w-full h-full object-cover object-center" autoplay loop muted playsinline preload="auto" poster="/images/video-poster.jpg">
      <source src="/media/LightningVideos.mp4" type="video/mp4" />
    </video>
    <div class="absolute inset-0 bg-black/40"></div>
    <div class="relative z-20 flex flex-col items-center justify-center h-full text-center px-6">
      <h1 class="font-extralight uppercase tracking-[0.2em] text-white text-4xl sm:text-6xl lg:text-8xl whitespace-nowrap drop-shadow-[0_4px_6px_rgba(0,0,0,0.55)]">Chase&nbsp;the&nbsp;Storm</h1>
      <a href="/collection" class="cta group relative inline-block px-10 py-3 mt-8 rounded-full border border-white/40 bg-white/10 backdrop-blur-md text-white uppercase tracking-widest text-sm whitespace-nowrap transition-all duration-300 hover:bg-white/15 focus:outline-none focus:ring-2 focus:ring-white/50">⚡Shop Official Merch⚡</a>
    </div>
  </section>

  <!-- Latest Video + CTA -->

  <section class="bg-gray-100 dark:bg-gray-800 py-16 flex flex-col items-center" id="latest">
    <div class="embed-wrapper relative pb-[56.25%] h-0">
+    <iframe
+      src="https://www.youtube.com/embed/videoseries?list=PLlRbVc_QVCbVIITtyLoazGK0g4IRwDa_J"
+      class="absolute top-0 left-0 w-full h-full"
+      frameborder="0"
+      allowfullscreen
+    ></iframe>
+  </div>
    <a href="https://twitch.tv/stormen" target="_blank" class="watch-link mt-8"><span>WATCH STORMEN'S STREAM</span></a>
  </section>

  <!-- Merch Preview -->

  <main class="flex-grow w-[90%] mx-auto px-2 pt-24 pb-16 grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <!-- Merch items here -->
  </main>

  <!-- Footer -->

  <footer class="bg-white dark:bg-gray-900 py-10 text-gray-900 dark:text-gray-100">
    <div class="container mx-auto flex flex-col items-center space-y-6">
      <div class="flex space-x-6">
        <!-- Social Links -->
      </div>
      <div class="w-full border-t border-gray-700"></div>
      <div class="text-sm">© 2025 Stormen. All rights reserved.</div>
    </div>
  </footer>

  <!-- Cloudflare Email Decode -->

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>

  <!-- Site-wide JS -->

  <script src="site.js" defer></script>

</body>
</html>
